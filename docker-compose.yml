services:
  karpa:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7250:7250"
    environment:
      - NODE_ENV=production
      - LM_STUDIO_URL=http://host.docker.internal:1234/v1/chat/completions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7250"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
