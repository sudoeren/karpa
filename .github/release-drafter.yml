name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["feature", "enhancement"]
  patch:
    labels: ["bug", "fix", "chore", "dependencies", "documentation", "ci"]
  default: patch
categories:
  - title: "🚨 Breaking Changes"
    labels: ["breaking"]
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Bug Fixes"
    labels: ["bug", "fix"]
  - title: "📚 Documentation"
    labels: ["documentation", "docs"]
  - title: "🔧 Maintenance"
    labels: ["chore", "dependencies", "ci", "refactor"]
  - title: "🤖 Models & Languages"
    labels: ["model", "language"]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
exclude-labels: ["skip-changelog"]
template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
