name: Tauri Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner keeps the AppImage's glibc requirement low.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure TypeScript is installed
        run: npm install typescript@6.0.3 --no-save

      - name: Build frontend
        run: npx next build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Karpa v__VERSION__"
          releaseBody: "See the assets below for your platform."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # linuxdeploy leaves AppRun.wrapped as 0770, so the AppImage fails to start
      # when run as another user (e.g. the AppImageHub firejail test). Repack it
      # with world-readable/executable permissions and replace the release asset.
      - name: Fix AppImage permissions
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get install -y libfuse2
          curl -sSLo /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          for appimage in src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage; do
            work="$(mktemp -d)"
            (cd "$work" && "$OLDPWD/$appimage" --appimage-extract >/dev/null)
            find "$work/squashfs-root" -type d -exec chmod go+rx {} +
            find "$work/squashfs-root" -type f -exec chmod go+r {} +
            find "$work/squashfs-root" -type f -perm -u+x -exec chmod go+x {} +
            ARCH=x86_64 /tmp/appimagetool --no-appstream "$work/squashfs-root" "$appimage"
            gh release upload "${{ github.ref_name }}" "$appimage" --clobber
          done
